# SciPulse — pipeline batch ArXiv (JSON lines -> arxiv-papers-raw)
input {
  file {
    path => "/data/arxiv-raw/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/dev/null"
  }
}

filter {
  mutate {
    rename => {
      "id"          => "arxiv_id"
      "update_date" => "date_updated"
    }
    remove_field => ["@version", "host", "path", "log", "event", "@timestamp"]
  }

  date {
    match => ["date_updated", "yyyy-MM-dd"]
    target => "date_updated"
  }

  mutate {
    split => { "categories" => " " }
  }

  ruby {
    code => '
      cats = event.get("categories")
      if cats.is_a?(Array) && cats.length > 0
        event.set("primary_category", cats[0])
      end
    '
  }

  mutate {
    gsub => ["abstract", "\n", " "]
    strip => ["abstract", "title"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "arxiv-papers-raw"
    document_id => "%{arxiv_id}"
    action => "index"
  }
}
